// Synapse GraphQL Context
//
// Defines the structure for accessing request context in resolvers and
// from_context field injection. Applications define their own context
// types; Synapse only requires they implement the ContextProvider trait.

syntax = "proto3";

package synapse.graphql;

// =============================================================================
// Context Access
// =============================================================================
//
// The from_context option accesses values via dotted paths:
//
//   int64 user_id = 1 [(synapse.graphql.field).from_context = {
//     path: "current_user.id"
//   }];
//
// Applications provide their own context struct. Common patterns:
//
//   struct AppContext {
//       current_user: Option<YourUserType>,
//       request: RequestInfo,
//       // ... any app-specific fields
//   }
//
// The path "current_user.id" extracts ctx.current_user?.id
//
// =============================================================================

// Request metadata - the only context Synapse defines
//
// Applications can include this in their context for common request info.
// All fields are optional; include what's relevant for your app.
message RequestInfo {
  // Distributed tracing ID (e.g., from X-Trace-Id header)
  string trace_id = 1;

  // Unique request ID
  string request_id = 2;

  // Client IP address
  string ip = 3;

  // User agent string
  string user_agent = 4;

  // Selected request headers
  map<string, string> headers = 10;
}
